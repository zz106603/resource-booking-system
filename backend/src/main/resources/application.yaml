spring:
  application:
    name: resource-booking-system
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/resource_booking}
    username: ${DB_USERNAME:resource_booking}
    password: ${DB_PASSWORD:local_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  paths-to-match: /api/**
  cache:
    disabled: true
  override-with-generic-response: false
  swagger-ui:
    disable-swagger-default-url: true
