plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

def tomcatSecurityVersion = '10.1.61'

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    // Keep Jackson modules aligned while applying security patches beyond the Boot BOM default.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.21.8')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    constraints {
        implementation("org.apache.tomcat.embed:tomcat-embed-core:${tomcatSecurityVersion}")
        implementation("org.apache.tomcat.embed:tomcat-embed-el:${tomcatSecurityVersion}")
        implementation("org.apache.tomcat.embed:tomcat-embed-websocket:${tomcatSecurityVersion}")
        implementation('org.postgresql:postgresql:42.7.14')
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
