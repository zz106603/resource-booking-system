name: resource-booking-system

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: resource_booking
      POSTGRES_USER: resource_booking
      POSTGRES_PASSWORD: local_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resource_booking -d resource_booking"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
